services:
  max-ai-bot:
    build: .
    container_name: max-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Nginx is the only public entrypoint; never expose Uvicorn directly.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
